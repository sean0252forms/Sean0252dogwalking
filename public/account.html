<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account – Paws & Stride</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2b2a28;--mute:#6f6a62;--accent:#2f7d5b;--accent2:#e9f3ee;--line:#e6dfd2}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#282623;--ink:#f1ede5;--mute:#a8a196;--accent:#59b88c;--accent2:#25362d;--line:#3a3733}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{margin:0;font-size:1.4rem}
h2{font-size:1.05rem;margin:26px 0 10px}
a,button.link{color:var(--accent);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card small{color:var(--mute);display:block}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px}
.btn{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.d{color:#b3261e}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;background:var(--accent2);border:1px solid var(--accent)}
.msg.err{background:#fdecea;color:#8a1f17;border-color:#e5a9a3}
.acts>*{margin-right:6px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>🐾 My account</h1><div><a href="/">Book a walk</a> · <button class="link" id="out">Sign out</button></div></div>
  <div id="who" style="color:var(--mute);margin-bottom:14px"></div>
  <div id="flash"></div>

  <h2>My bookings</h2>
  <div id="list">Loading…</div>
  <small style="color:var(--mute)">You can cancel or reschedule online until the day before your walk.</small>

  <h2>My dogs</h2>
  <div id="dogs"></div>
  <div class="card">
    <b>Add a dog</b>
    <input id="dname" placeholder="Dog's name">
    <textarea id="dnotes" rows="2" placeholder="Notes (leash habits, allergies, gate codes)"></textarea>
    <button class="btn p" id="dadd">Save dog</button>
  </div>
</main>
<script>
const API = window.__HATCHABLE__ ? window.__HATCHABLE__.api : "/api";
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const post = (path, body, method) => fetch(API + path, { method: method || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
function flash(t, err) { const f = $("flash"); f.textContent = t || ""; f.className = t ? "msg" + (err ? " err" : "") : ""; if (t) scrollTo(0, 0); }

const TIMES = [];
for (let h = 7; h <= 18; h++) for (const m of ["00", "30"]) TIMES.push([String(h).padStart(2, "0") + ":" + m, (h > 12 ? h - 12 : h) + ":" + m + (h >= 12 ? " PM" : " AM")]);

async function loadBookings() {
  const list = $("list"); list.textContent = "";
  const r = await fetch(API + "/account/bookings");
  if (!r.ok) { list.textContent = "Couldn't load your bookings."; return; }
  const rows = await r.json();
  if (!rows.length) { list.append(el("p", "", "No bookings yet.")); const a = el("a", "btn p", "Book your first walk"); a.href = "/"; list.append(a); return; }
  rows.forEach(b => {
    const c = el("div", "card"), h = el("div");
    h.append(el("b", "", b.dog_name + " · " + b.service), el("span", "tag", b.status === "pending" ? "awaiting payment" : b.status));
    c.append(h, el("small", "", b.walk_date + " at " + b.walk_time + " · $" + (b.price_cents / 100).toFixed(2)), el("small", "", b.address), el("small", "", "Booking #" + b.id));
    if (b.can_change) {
      const acts = el("div", "acts"), box = el("div");
      const rs = el("button", "btn", "Reschedule"), cx = el("button", "btn d", "Cancel");
      rs.onclick = () => { box.style.display = box.style.display === "none" ? "block" : "none"; };
      cx.onclick = async () => {
        if (!confirm("Cancel this booking?" + (b.status === "paid" ? " Your card payment will be refunded." : ""))) return;
        const x = await post("/account/cancel", { id: b.id }), j = await x.json();
        if (!x.ok) return flash(j.error || "Couldn't cancel.", true);
        flash(j.refund === "refunded" ? "Booking cancelled and refunded to your card (it can take 5-10 days to show up)." : j.refund ? "Booking cancelled. We'll be in touch about your refund." : "Booking cancelled.");
        loadBookings();
      };
      acts.append(rs, cx);
      box.style.display = "none";
      const row = el("div", "row"), d = el("input"), t = el("select");
      d.type = "date"; d.value = b.walk_date;
      const tm = new Date(); tm.setDate(tm.getDate() + 1); d.min = tm.toISOString().slice(0, 10);
      TIMES.forEach(([v, l]) => { const o = el("option", "", l); o.value = v; if (v === b.walk_time) o.selected = true; t.append(o); });
      row.append(d, t);
      const save = el("button", "btn p", "Save new time");
      save.onclick = async () => {
        const x = await post("/account/reschedule", { id: b.id, walk_date: d.value, walk_time: t.value }), j = await x.json();
        if (!x.ok) return flash(j.error || "Couldn't reschedule.", true);
        flash("Rescheduled. We've emailed you the new time."); loadBookings();
      };
      box.append(row, save);
      c.append(acts, box);
    }
    list.append(c);
  });
}

async function loadDogs() {
  const box = $("dogs"); box.textContent = "";
  const r = await fetch(API + "/account/dogs");
  if (!r.ok) return;
  const dogs = await r.json();
  if (!dogs.length) box.append(el("p", "", "No saved dogs yet. Add one below, or tick \"Save this dog\" when you book."));
  dogs.forEach(d => {
    const c = el("div", "card");
    const name = el("input"); name.value = d.name;
    const notes = el("textarea"); notes.rows = 2; notes.value = d.notes || ""; notes.placeholder = "Notes";
    const save = el("button", "btn p", "Update"), del = el("button", "btn d", "Remove");
    save.onclick = async () => { const x = await post("/account/dogs", { id: d.id, name: name.value, notes: notes.value }); if (x.ok) flash("Saved."); else flash("Couldn't save.", true); };
    del.onclick = async () => { if (confirm("Remove " + d.name + "?")) { await post("/account/dogs", { id: d.id }, "DELETE"); loadDogs(); } };
    const acts = el("div", "acts"); acts.append(save, del);
    c.append(name, notes, acts); box.append(c);
  });
}

$("dadd").onclick = async () => {
  const x = await post("/account/dogs", { name: $("dname").value, notes: $("dnotes").value });
  if (!x.ok) return flash((await x.json()).error || "Couldn't save.", true);
  $("dname").value = ""; $("dnotes").value = ""; flash("Dog saved."); loadDogs();
};
$("out").onclick = async () => { await window.hatchable.auth.signOut(); location.href = "/"; };

(async () => {
  const s = await window.hatchable.auth.getSession();
  if (!s || !s.user) { location.href = "/login?next=/account.html"; return; }
  $("who").textContent = "Signed in as " + s.user.email;
  loadBookings(); loadDogs();
})();
</script>
</body>
</html>
