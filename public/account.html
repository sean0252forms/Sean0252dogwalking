<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My bookings – Paws & Stride</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2b2a28;--mute:#6f6a62;--accent:#2f7d5b;--accent2:#e9f3ee;--line:#e6dfd2}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#282623;--ink:#f1ede5;--mute:#a8a196;--accent:#59b88c;--accent2:#25362d;--line:#3a3733}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
h1{margin:0;font-size:1.4rem}
a,button.link{color:var(--accent);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card small{color:var(--mute);display:block}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px}
.btn{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="top"><h1>🐾 My bookings</h1><div><a href="/">Book a walk</a> · <button class="link" id="out">Sign out</button></div></div>
  <div id="who" style="color:var(--mute);margin-bottom:14px"></div>
  <div id="list">Loading…</div>
</main>
<script>
const API = window.__HATCHABLE__ ? window.__HATCHABLE__.api : "/api";
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
(async () => {
  const s = await window.hatchable.auth.getSession();
  if (!s || !s.user) { location.href = "/login?next=/account.html"; return; }
  document.getElementById("who").textContent = "Signed in as " + s.user.email;
  const r = await fetch(API + "/account/bookings");
  const list = document.getElementById("list"); list.textContent = "";
  if (!r.ok) { list.textContent = "Couldn't load your bookings."; return; }
  const rows = await r.json();
  if (!rows.length) { list.append(el("p", "", "No bookings yet.")); const a = el("a", "btn", "Book your first walk"); a.href = "/"; list.append(a); return; }
  rows.forEach(b => {
    const c = el("div", "card"), h = el("div");
    h.append(el("b", "", b.dog_name + " · " + b.service), el("span", "tag", b.status === "pending" ? "awaiting payment" : b.status));
    c.append(h, el("small", "", b.walk_date + " at " + b.walk_time + " · $" + (b.price_cents / 100).toFixed(2)), el("small", "", b.address), el("small", "", "Booking #" + b.id));
    list.append(c);
  });
})();
document.getElementById("out").onclick = async () => { await window.hatchable.auth.signOut(); location.href = "/"; };
</script>
</body>
</html>
